DOCUMENTATION:
  module: publish_archive
  short_description: Create deterministic public AIA/CDP publish archives on the managed host
  version_added: 0.1.0
  description:
    - Create deterministic public AIA/CDP publish archives on the managed host.
  author:
    - Jonas Mauer (@jomrr)
  extends_documentation_fragment:
    - jomrr.ca.context
  attributes:
    check_mode:
      support: none
      description: Skipped in check mode without changing the managed host.
    diff_mode:
      support: none
      description: No diff output is returned.
  requirements:
    - Python 3.12 on the managed Linux host
  notes:
    - The base directory and persistent inventory must be preserved between runs.
    - Private utilities are internal implementation details and are not a public API.
  options:
    dest:
      description: Archive path on the managed host.
      version_added: 0.1.0
      type: path
      required: true
    artifacts:
      description: Explicit public artifacts to include. Each item needs C(src), C(file), and C(area);
        when set, this overrides authority-derived artifacts.
      version_added: 0.1.0
      type: list
      default: []
      elements: dict
    authorities:
      description: Managed authorities used to derive default AIA/CDP artifacts.
      version_added: 0.1.0
      type: list
      default: []
      elements: dict
    artifact_mode:
      description: Mode stored for files inside the archive.
      version_added: 0.1.0
      type: str
      default: '0644'
    mode:
      description: Filesystem mode for the generated archive file.
      version_added: 0.1.0
      type: str
      default: '0600'
    owner:
      description: Owner of generated files; user name or numeric UID.
      type: str
      version_added: 0.1.0
    group:
      description: Group of generated files; group name or numeric GID.
      type: str
      version_added: 0.1.0
EXAMPLES: |
  - name: Build CA publish archive
    jomrr.ca.publish_archive:
      base_dir: /etc/pki/example
      dest: /tmp/example-public.tar
      authorities: "{{ ca_authorities }}"
      artifact_mode: "0644"
      owner: root
      group: root
      mode: "0600"
RETURN:
  path:
    description: Archive path on the managed host.
    type: str
    returned: success
  archive_paths:
    description: Relative paths stored in the archive.
    type: list
    returned: success
