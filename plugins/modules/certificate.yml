DOCUMENTATION:
  module: certificate
  short_description: Dispatch one managed CA collection certificate to the built-in X.509 profiles
  version_added: 0.1.0
  description:
    - Dispatch one managed CA collection certificate to the built-in X.509 profiles.
  author:
    - Jonas Mauer (@jomrr)
  extends_documentation_fragment:
    - jomrr.ca.context
  attributes:
    check_mode:
      support: none
      description: Skipped in check mode without changing the managed host.
    diff_mode:
      support: none
      description: No diff output is returned.
  requirements:
    - Python 3.12 on the managed Linux host
    - cryptography >= 43 on the managed host
  notes:
    - The base directory and persistent inventory must be preserved between runs.
    - Private utilities are internal implementation details and are not a public API.
    - Supply the authorities and certificate_types mappings explicitly; no standalone role defaults are
      loaded.
    - Pass owner and group explicitly; the source implementation needs these values when deriving certificate
      paths.
  options:
    base_url:
      description: Base publication URL. If set, AIA defaults to C(<base_url>/aia/<issuer>-ca.der) and
        CDP to C(<base_url>/crl/<issuer>-ca.crl).
      version_added: 0.1.0
      type: str
      default: ''
    ca_name:
      description: Enables composed inventory output when non-empty.
      version_added: 0.1.0
      type: str
      default: ''
    certificate_types:
      description: Role type map. The selected type must define C(issuer) and may define C(required_fields).
      version_added: 0.1.0
      type: dict
      required: true
    authorities:
      description: Authority list used to resolve issuer passphrase and C(default_days).
      version_added: 0.1.0
      type: list
      required: true
      elements: dict
    kerberos_realm:
      description: Default realm for MSKDC certificates.
      version_added: 0.1.0
      type: str
      default: ''
    subject:
      description: Certificate-local subject values merged over module C(subject).
      version_added: 0.1.0
      type: dict
      default: {}
    renewal:
      description: Certificate-local renewal and rekey policy.
      version_added: 0.1.0
      type: dict
      default: {}
    certificate:
      description: Declarative certificate item.
      version_added: 0.1.0
      type: dict
      required: true
    owner:
      description: Owner of generated files; user name or numeric UID.
      type: str
      version_added: 0.1.0
    group:
      description: Group of generated files; group name or numeric GID.
      type: str
      version_added: 0.1.0
EXAMPLES: |
  - name: Issue web certificate
    jomrr.ca.certificate:
      base_dir: /etc/pki/example
      ca_name: example
      base_url: http://pki.example.test
      certificate:
        name: web01
        type: tls_server
        common_name: web01.example.test
        san:
          - DNS:web01.example.test
          - DNS:web01
      certificate_types:
        tls_server:
          issuer: component
      authorities:
        - name: root
          parent: root
          key_passphrase: "{{ ca_root_passphrase }}"
          default_days: 3650
        - name: component
          parent: root
          key_passphrase: "{{ ca_component_passphrase }}"
          default_days: 397

  - name: Issue identity certificate
    jomrr.ca.certificate:
      base_dir: /etc/pki/example
      ca_name: example
      certificate:
        name: alice
        type: identity
        common_name: Alice Example
        email: alice@example.test
        pfx_passphrase: "{{ alice_pfx_passphrase }}"
      certificate_types:
        identity:
          issuer: identity
      authorities: "{{ ca_authorities }}"

  - name: Sign external web CSR
    jomrr.ca.certificate:
      base_dir: /etc/pki/example
      ca_name: example
      base_url: http://pki.example.test
      certificate:
        name: external-web01
        type: tls_server
        csr_path: /srv/pki/requests/external-web01.csr
        formats:
          - pem
          - der
          - txt
          - fullchain
      certificate_types:
        tls_server:
          issuer: component
      authorities: "{{ ca_authorities }}"

  - name: Issue MSKDC certificate
    jomrr.ca.certificate:
      base_dir: /etc/pki/example
      ca_name: example
      kerberos_realm: EXAMPLE.TEST
      certificate:
        name: dc01
        type: mskdc
        common_name: dc01.example.test
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
      certificate_types:
        mskdc:
          issuer: component
          required_fields:
            - ad_object_guid
      authorities: "{{ ca_authorities }}"
RETURN:
  name:
    description: Certificate name.
    type: str
    returned: success
  profile:
    description: Resolved certificate profile.
    type: str
    returned: success
  directory_changed:
    description: Whether the output directory changed.
    type: bool
    returned: success
  archive_changed:
    description: Whether replaced generation material was archived.
    type: bool
    returned: success
  key_changed:
    description: Whether the private key changed.
    type: bool
    returned: success
  csr_changed:
    description: Whether the CSR changed.
    type: bool
    returned: success
  cert_changed:
    description: Whether the PEM certificate changed.
    type: bool
    returned: success
  der_changed:
    description: Whether the DER export changed.
    type: bool
    returned: success
  txt_changed:
    description: Whether the text export changed.
    type: bool
    returned: success
  chain_changed:
    description: Whether the issuer chain copy changed.
    type: bool
    returned: success
  pkcs12_changed:
    description: Whether any PKCS#12 export changed.
    type: bool
    returned: success
  fullchain_changed:
    description: Whether the fullchain bundle changed.
    type: bool
    returned: success
  fritzbox_bundle_changed:
    description: Whether the FritzBox import bundle changed.
    type: bool
    returned: success
  inventory_changed:
    description: Whether CA inventory state changed.
    type: bool
    returned: success
  formats:
    description: Normalized formats.
    type: list
    returned: success
    elements: str
  renewal:
    description: Renewal decision for this run.
    type: dict
    returned: success
  csr_path:
    description: CSR path.
    type: str
    returned: success
  cert_path:
    description: PEM certificate path.
    type: str
    returned: success
  txt_path:
    description: Text export path, or empty string.
    type: str
    returned: success
  pkcs12_paths:
    description: Written PKCS#12 paths keyed by format.
    type: dict
    returned: success
  fullchain_path:
    description: Fullchain bundle path, or empty string.
    type: str
    returned: success
  fritzbox_bundle_path:
    description: FritzBox import bundle path, or empty string.
    type: str
    returned: success
