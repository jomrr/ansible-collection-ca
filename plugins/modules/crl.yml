DOCUMENTATION:
  module: crl
  short_description: Manage CA collection certificate revocation lists
  version_added: 0.1.0
  description:
    - Manage CA collection certificate revocation lists.
  author:
    - Jonas Mauer (@jomrr)
  extends_documentation_fragment:
    - jomrr.ca.context
  attributes:
    check_mode:
      support: none
      description: Skipped in check mode without changing the managed host.
    diff_mode:
      support: none
      description: No diff output is returned.
  requirements:
    - Python 3.12 on the managed Linux host
    - cryptography >= 43 on the managed host
  notes:
    - The base directory and persistent inventory must be preserved between runs.
    - Private utilities are internal implementation details and are not a public API.
  options:
    base_url:
      description: Stored in composed inventory when C(ca_name) is set.
      version_added: 0.1.0
      type: str
      default: ''
    ca_name:
      description: Enables composed inventory output when non-empty.
      version_added: 0.1.0
      type: str
      default: ''
    name:
      description: Authority short name used to locate its certificate and private key.
      version_added: 0.1.0
      type: str
      required: true
    formats:
      description: CRL output formats written from one generated CRL object.
      version_added: 0.1.0
      type: list
      default:
        - pem
        - der
      elements: str
    key_passphrase:
      description: Passphrase for the CA private key.
      version_added: 0.1.0
      type: str
      required: true
    common_name:
      description: CA subject Common Name.
      version_added: 0.1.0
      type: str
      required: true
    subject:
      description: Subject defaults for the CRL issuer name.
      version_added: 0.1.0
      type: dict
      default: {}
    next_update_days:
      description: Number of days until CRL C(nextUpdate).
      version_added: 0.1.0
      type: int
      required: true
    renew_before_days:
      description: Renew this many days before CRL expiry; must be less than next_update_days.
      version_added: 0.1.0
      type: float
      default: 7
    revoked_certificates:
      description: Declarative revoked certificate entries.
      version_added: 0.1.0
      type: list
      default: []
      elements: dict
    digest:
      description: Signature digest for RSA and ECDSA CA keys.
      version_added: 0.1.0
      type: str
      default: sha384
      choices:
        - sha224
        - sha256
        - sha384
        - sha512
    mode:
      description: CRL file mode.
      version_added: 0.1.0
      type: str
      default: '0644'
    owner:
      description: Owner of generated files; user name or numeric UID.
      type: str
      version_added: 0.1.0
    group:
      description: Group of generated files; group name or numeric GID.
      type: str
      version_added: 0.1.0
EXAMPLES: |
  - name: Create component CA CRL
    jomrr.ca.crl:
      base_dir: /etc/pki/example
      ca_name: example
      name: component
      common_name: Example Component CA
      subject:
        country: DE
        organization: Example
        organizational_unit: Example PKI
      next_update_days: 7
      renew_before_days: 1
      key_passphrase: "{{ ca_component_passphrase }}"

  - name: Create component CA CRLs
    jomrr.ca.crl:
      base_dir: /etc/pki/example
      ca_name: example
      name: component
      common_name: Example Component CA
      next_update_days: 7
      renew_before_days: 1
      key_passphrase: "{{ ca_component_passphrase }}"
      revoked_certificates:
        - name: web01
          reason: key_compromise
          invalidity_date: "2026-06-14T00:00:00Z"

  - name: Create component CA CRLs with fingerprint revocation
    jomrr.ca.crl:
      base_dir: /etc/pki/example
      ca_name: example
      name: component
      common_name: Example Component CA
      next_update_days: 7
      renew_before_days: 1
      key_passphrase: "{{ ca_component_passphrase }}"
      revoked_certificates:
        - sha256: "0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF"
          reason: superseded
RETURN:
  inventory_changed:
    description: Whether inventory state changed.
    type: bool
    returned: success
  paths:
    description: Output paths keyed by format.
    type: dict
    returned: success
  crl_number:
    description: CRL Number extension value.
    type: int
    returned: success
  formats:
    description: Normalized CRL output formats.
    type: list
    elements: str
    returned: success
