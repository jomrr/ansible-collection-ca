---
- name: Allocate artifact manifest fixture
  ansible.builtin.tempfile:
    state: directory
  register: ca_artifact_fixture

- name: Exercise artifact manifest against real issuance
  vars:
    ca_artifact_authorities:
      - name: root
        parent: root
        common_name: Artifact Root
        days: 365
        default_days: 90
        key_type: P-256
        key_passphrase: artifact-test-passphrase
        formats: [pem, der, cer, txt]
    ca_artifact_certificates:
      - name: web01
        type: tls_server
        common_name: web01.example.test
        key_type: P-256
        formats: [der, cer, txt, fullchain, bundle, fritzbox, pfx, p12]
        pfx_passphrase: artifact-test-passphrase
      - name: scanner
        type: tls_server
        common_name: scanner.example.test
        key_type: P-256
        formats: [der, cer, txt, fullchain, bundle, fritzbox, pfx, p12]
        pfx_passphrase: artifact-test-passphrase
        publish_private: true
    ca_artifact_types:
      tls_server: {issuer: root}
  block:
    - name: Build manifest before any files exist
      ansible.builtin.set_fact:
        ca_artifact_manifest: '{{ ca_artifact_certificates | jomrr.ca.artifacts(ca_artifact_authorities) }}'

    - name: Verify private opt-in and mandatory public files
      ansible.builtin.assert:
        that:
          - ca_artifact_manifest | length == 21
          - ca_artifact_manifest | selectattr('secret') | list | length == 5
          - ca_artifact_manifest | selectattr('secret') | map(attribute='owner') | unique | list == ['scanner']
          - ca_artifact_manifest | map(attribute='src') | list == ca_artifact_manifest | map(attribute='src') | sort
          - "'certs/web01/web01.pem' in (ca_artifact_manifest | map(attribute='src'))"
          - "'certs/web01/web01-chain.pem' in (ca_artifact_manifest | map(attribute='src'))"

    - name: Create manifest authority
      jomrr.ca.authority_batch:
        base_dir: '{{ ca_artifact_fixture.path }}'
        authorities: '{{ ca_artifact_authorities }}'

    - name: Issue manifest certificates and repeat
      jomrr.ca.certificate_batch:
        base_dir: '{{ ca_artifact_fixture.path }}'
        owner: root
        group: root
        authorities: '{{ ca_artifact_authorities }}'
        certificate_types: '{{ ca_artifact_types }}'
        certificates: '{{ ca_artifact_certificates }}'
      loop: [first, repeat]
      register: ca_artifact_runs

    - name: Inspect every advertised path
      ansible.builtin.stat:
        path: '{{ ca_artifact_fixture.path }}/{{ item.src }}'
      loop: '{{ ca_artifact_manifest }}'
      loop_control:
        label: '{{ item.src }}'
      register: ca_artifact_files

    - name: Verify every advertised path exists
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
      loop: '{{ ca_artifact_files.results }}'
      loop_control:
        label: '{{ item.item.src }}'

    - name: Change only the public certificate's publication opt-in
      jomrr.ca.certificate:
        base_dir: '{{ ca_artifact_fixture.path }}'
        owner: root
        group: root
        authorities: '{{ ca_artifact_authorities }}'
        certificate_types: '{{ ca_artifact_types }}'
        certificate: '{{ ca_artifact_certificates[0] | combine({"publish_private": true}) }}'
      register: ca_artifact_opt_in

    - name: Verify issuance is idempotent and independent of publication metadata
      ansible.builtin.assert:
        that:
          - ca_artifact_runs.results[0].changed
          - not ca_artifact_runs.results[1].changed
          - ca_artifact_opt_in is not changed

    - name: Ignore unrelated unresolved secrets in definitions
      vars:
        ca_artifact_lazy:
          - name: lazy
            type: tls_server
            key_passphrase: '{{ ca_intentionally_undefined_key_passphrase }}'
      ansible.builtin.assert:
        that:
          - ca_artifact_lazy | jomrr.ca.artifacts([]) | length == 4
  always:
    - name: Remove artifact manifest fixture
      ansible.builtin.file:
        path: '{{ ca_artifact_fixture.path }}'
        state: absent
