---
- name: Create root and issuing CA for key rollover
  jomrr.ca.authority:
    base_dir: '{{ ca_test_root.path }}/rollover'
    base_url: http://pki.example.test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: '{{ item.name }}'
    parent: '{{ item.parent }}'
    common_name: '{{ item.name }}'
    days: 365
    key_type: P-256
    key_passphrase: rollover-test
    parent_key_passphrase: rollover-test
  loop: &rollover_authorities
    - {name: root, parent: root, key_passphrase: rollover-test, default_days: 90}
    - {name: issuer, parent: root, key_passphrase: rollover-test, default_days: 90}
  loop_control:
    label: '{{ item.name }}'
- name: Create the original issuing CA chain
  jomrr.ca.chain:
    base_dir: '{{ ca_test_root.path }}/rollover'
    name: issuer
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
- name: Issue certificates under the original CA key
  jomrr.ca.certificate_batch:
    base_dir: '{{ ca_test_root.path }}/rollover'
    base_url: http://pki.example.test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *rollover_authorities
    certificate_types:
      tls_server: {issuer: issuer}
    certificates:
      - {name: old, common_name: old.example.test, type: tls_server, key_type: P-256, formats: [pem]}
      - {name: old-valid, common_name: old-valid.example.test, type: tls_server, key_type: P-256, formats: [pem]}
- name: Create initial CRLs for both authorities
  jomrr.ca.crl:
    base_dir: '{{ ca_test_root.path }}/rollover'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: '{{ item }}'
    key_passphrase: rollover-test
    next_update_days: 30
  loop: [root, issuer]
- name: Renew issuing CA with a new key through the renewal window
  jomrr.ca.authority:
    base_dir: '{{ ca_test_root.path }}/rollover'
    base_url: http://pki.example.test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: issuer
    parent: root
    common_name: issuer
    days: 730
    key_type: P-256
    key_passphrase: rollover-test
    parent_key_passphrase: rollover-test
    renewal:
      renew_before_days: 366
      rekey: true
  register: ca_rollover_renewed
- name: Verify an actual CA key rollover occurred
  ansible.builtin.assert:
    that:
      - ca_rollover_renewed.changed
      - ca_rollover_renewed.renewal.rekey
- name: Refresh the issuing CA chain after rollover
  jomrr.ca.chain:
    base_dir: '{{ ca_test_root.path }}/rollover'
    name: issuer
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
- name: Issue a leaf under the new CA key
  jomrr.ca.certificate: &rollover_new_certificate
    base_dir: '{{ ca_test_root.path }}/rollover'
    base_url: http://pki.example.test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *rollover_authorities
    certificate_types:
      tls_server: {issuer: issuer}
    certificate:
      name: new
      common_name: new.example.test
      type: tls_server
      key_type: P-256
      formats: [pem]
- name: Revoke the old leaf and repeat for idempotence
  jomrr.ca.crl:
    base_dir: '{{ ca_test_root.path }}/rollover'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: issuer
    key_passphrase: rollover-test
    next_update_days: 30
    revoked_certificates:
      - {name: old, reason: key_compromise}
  loop: [first, repeat]
  register: ca_rollover_crls
- name: Verify CRLs exist for both generations and converge
  ansible.builtin.assert:
    that:
      - ca_rollover_crls.results[0].changed
      - not ca_rollover_crls.results[1].changed
      - ca_rollover_crls.results[0].generations | length == 2
- name: Publish all issuer generations and repeat for idempotence
  jomrr.ca.publish_archive:
    base_dir: '{{ ca_test_root.path }}/rollover'
    dest: '{{ ca_test_root.path }}/rollover/public.tar'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *rollover_authorities
  loop: [first, repeat]
  register: ca_rollover_published
- name: Verify publication converges
  ansible.builtin.assert:
    that:
      - ca_rollover_published.results[0].changed
      - not ca_rollover_published.results[1].changed
- name: Verify old and new leaves against their published AIA and CDP material
  ansible.builtin.script:
    cmd: "{{ ca_rollover_script | default('rollover.py') }} {{ ca_test_root.path }}/rollover"
    executable: '{{ ansible_python_interpreter }}'
  changed_when: false
- name: Prepare a previous-version rollover with conflicting legacy URLs
  ansible.builtin.script:
    cmd: "{{ ca_rollover_state_script | default('rollover_state.py') }} {{ ca_test_root.path }}/rollover legacy"
    executable: '{{ ansible_python_interpreter }}'
  changed_when: true
- name: Reject automatic selection between conflicting legacy URL owners
  jomrr.ca.crl: &rollover_crl
    base_dir: '{{ ca_test_root.path }}/rollover'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: issuer
    key_passphrase: rollover-test
    next_update_days: 30
  register: ca_rollover_ambiguous
  failed_when: false
- name: Verify migration needs an explicit URL owner
  ansible.builtin.assert:
    that:
      - not ca_rollover_ambiguous.changed
      - "'Select legacy_generation' in ca_rollover_ambiguous.msg"
- name: Restore archived CRL service and select the original legacy URL owner
  jomrr.ca.crl:
    <<: *rollover_crl
    legacy_generation: '{{ ca_rollover_crls.results[0].legacy_generation }}'
  register: ca_rollover_migrated
- name: Verify migration reports the affected newer certificate
  ansible.builtin.assert:
    that:
      - ca_rollover_migrated.changed
      - ca_rollover_migrated.generations | length == 2
      - ca_rollover_migrated.migration_conflicts | length == 1
      - ca_rollover_migrated.migration_conflicts[0].name == 'new'
- name: Reissue the certificate whose embedded URLs conflict
  jomrr.ca.certificate: *rollover_new_certificate
- name: Revoke the superseded certificate with conflicting URLs
  jomrr.ca.crl:
    <<: *rollover_crl
    revoked_certificates:
      - serial_number: '{{ ca_rollover_migrated.migration_conflicts[0].serial_number }}'
        reason: superseded
  register: ca_rollover_repaired
- name: Verify no valid certificate remains with conflicting issuer URLs
  ansible.builtin.assert:
    that:
      - ca_rollover_repaired.migration_conflicts == []
- name: Prepare expired old leaves and remove their archived CA private key
  ansible.builtin.script:
    cmd: "{{ ca_rollover_state_script | default('rollover_state.py') }} {{ ca_test_root.path }}/rollover expire"
    executable: '{{ ansible_python_interpreter }}'
  changed_when: true
- name: Retire the old CRL without its private key and repeat for idempotence
  jomrr.ca.crl: *rollover_crl
  loop: [first, repeat]
  register: ca_rollover_retired
- name: Verify the old generation no longer needs CRL signatures
  ansible.builtin.assert:
    that:
      - ca_rollover_retired.results[0].generations[ca_rollover_migrated.legacy_generation].retired
      - not ca_rollover_retired.results[1].changed
- name: Verify the last old CRL was left unchanged
  ansible.builtin.script:
    cmd: "{{ ca_rollover_state_script | default('rollover_state.py') }} {{ ca_test_root.path }}/rollover verify-retired"
    executable: '{{ ansible_python_interpreter }}'
  changed_when: false
