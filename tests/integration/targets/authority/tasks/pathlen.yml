---
- name: Create CAs with finite and wider advertised path limits
  jomrr.ca.authority:
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: '{{ item.name }}'
    parent: '{{ item.parent }}'
    common_name: '{{ item.name }}'
    days: 365
    key_type: P-256
    key_passphrase: pathlen-test
    parent_key_passphrase: pathlen-test
    basic_constraints:
      - CA:TRUE
      - 'pathlen:{{ item.pathlen }}'
  loop:
    - {name: root, parent: root, pathlen: 1}
    - {name: issuer, parent: root, pathlen: 0}
    - {name: permissive, parent: root, pathlen: 3}
- name: Reject a subordinate CA when its issuer or root has no remaining depth
  jomrr.ca.authority:
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: 'forbidden-{{ item.name }}'
    parent: '{{ item.name }}'
    common_name: Forbidden CA
    days: 30
    key_type: P-256
    key_passphrase: pathlen-test
    parent_key_passphrase: pathlen-test
  loop:
    - {name: issuer, limit: 0}
    - {name: permissive, limit: 1}
  register: ca_pathlen_rejections
  failed_when: false
- name: Verify path constraint diagnostics
  ansible.builtin.assert:
    that:
      - not item.changed
      - "('pathlen:' ~ item.item.limit) in item.msg"
      - "'would be exceeded' in item.msg"
  loop: '{{ ca_pathlen_rejections.results }}'
- name: Create external CA request fixture
  ansible.builtin.script:
    cmd: "{{ ca_pathlen_script | default('pathlen.py') }} prepare {{ ca_test_root.path }}/pathlen"
    executable: '{{ ansible_python_interpreter }}'
  changed_when: true
- name: Read external CSR
  ansible.builtin.slurp:
    src: '{{ ca_test_root.path }}/pathlen/external.csr'
  register: ca_pathlen_csr
- name: Reject an external CA request under pathlen zero
  jomrr.ca.certificate:
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: &pathlen_authorities
      - {name: root, parent: root, key_passphrase: pathlen-test, default_days: 90}
      - {name: issuer, parent: root, key_passphrase: pathlen-test, default_days: 90}
    certificate_types:
      issuing_ca: {issuer: issuer}
    certificate: &pathlen_request
      name: openbao
      common_name: OpenBao CA
      type: issuing_ca
      csr_content: '{{ ca_pathlen_csr.content | b64decode }}'
  register: ca_pathlen_csr_rejected
  failed_when: false
- name: Reject the same external CA in the batch module
  jomrr.ca.certificate_batch:
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *pathlen_authorities
    certificate_types:
      issuing_ca: {issuer: issuer}
    certificates:
      - *pathlen_request
  register: ca_pathlen_batch_rejected
  failed_when: false
- name: Verify both CSR entry points reject the invalid path
  ansible.builtin.assert:
    that:
      - "'would be exceeded' in ca_pathlen_csr_rejected.msg"
      - "'non-self-issued intermediate CAs' in ca_pathlen_csr_rejected.msg"
      - "'would be exceeded' in ca_pathlen_batch_rejected.msg"
      - "'non-self-issued intermediate CAs' in ca_pathlen_batch_rejected.msg"
- name: Inspect paths belonging to rejected requests
  ansible.builtin.stat:
    path: '{{ ca_test_root.path }}/pathlen/{{ item }}'
  loop:
    - private/forbidden-issuer-ca.key
    - csr/forbidden-issuer-ca.csr
    - ca/forbidden-issuer-ca.pem
    - private/forbidden-permissive-ca.key
    - csr/forbidden-permissive-ca.csr
    - ca/forbidden-permissive-ca.pem
    - csr/openbao.csr
    - certs/openbao
  register: ca_pathlen_files
- name: Verify rejected requests wrote no certificate material
  ansible.builtin.assert:
    that:
      - not item.stat.exists
  loop: '{{ ca_pathlen_files.results }}'
- name: Sign an external issuing CA directly with the root
  jomrr.ca.certificate: &pathlen_root_request
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *pathlen_authorities
    certificate_types:
      issuing_ca: {issuer: root}
    certificate: *pathlen_request
  register: ca_pathlen_signed
- name: Repeat the external CA request
  jomrr.ca.certificate: *pathlen_root_request
  register: ca_pathlen_repeated
- name: Repeat issuance through the batch module using the CSR file
  jomrr.ca.certificate_batch:
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *pathlen_authorities
    certificate_types:
      issuing_ca: {issuer: root}
    certificates:
      - name: openbao
        common_name: OpenBao CA
        type: issuing_ca
        csr_path: '{{ ca_test_root.path }}/pathlen/external.csr'
  register: ca_pathlen_batch_signed
- name: Verify external CA issuance and idempotence
  ansible.builtin.assert:
    that:
      - ca_pathlen_signed is changed
      - ca_pathlen_repeated is not changed
      - ca_pathlen_batch_signed is not changed
      - ca_pathlen_signed.profile == 'issuing_ca'
      - ca_pathlen_signed.formats == ['pem', 'der', 'txt', 'fullchain']
      - not ca_pathlen_signed.key_changed
      - ca_pathlen_batch_signed.results[0].cert_path == ca_pathlen_signed.cert_path
- name: Sign external CAs with leaf profiles without inheriting leaf extensions
  jomrr.ca.certificate_batch:
    base_dir: '{{ ca_test_root.path }}/pathlen'
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *pathlen_authorities
    certificate_types:
      tls_server: {issuer: root}
      tls_client: {issuer: root}
    certificates:
      - <<: &pathlen_leaf_profile
          common_name: OpenBao CA
          csr_path: '{{ ca_test_root.path }}/pathlen/external.csr'
          basic_constraints: [CA:TRUE, 'pathlen:0']
          key_usage: [keyCertSign, cRLSign]
          formats: [pem, der, txt, fullchain]
        name: tls-server-ca
        type: tls_server
      - <<: *pathlen_leaf_profile
        name: tls-client-ca
        type: tls_client
        extended_key_usage: []
        san: []
  loop: [first, repeat]
  register: ca_pathlen_leaf_profiles
- name: Verify leaf-profile CA issuance and idempotence
  ansible.builtin.assert:
    that:
      - ca_pathlen_leaf_profiles.results[0] is changed
      - ca_pathlen_leaf_profiles.results[1] is not changed
- name: Issue a leaf using the external CA key
  ansible.builtin.script:
    cmd: >-
      {{ ca_pathlen_script | default('pathlen.py') }} leaf
      {{ ca_test_root.path }}/pathlen openbao tls-server-ca tls-client-ca
    executable: '{{ ansible_python_interpreter }}'
  changed_when: true
- name: Verify the full leaf path using OpenSSL
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -purpose
      - '{{ item.1 }}'
      - -CAfile
      - '{{ ca_test_root.path }}/pathlen/ca/root-ca.pem'
      - -untrusted
      - '{{ ca_test_root.path }}/pathlen/certs/{{ item.0 }}/{{ item.0 }}.pem'
      - '{{ ca_test_root.path }}/pathlen/leaf.pem'
  changed_when: false
  loop: "{{ ['openbao', 'tls-server-ca', 'tls-client-ca'] | product(['sslserver', 'sslclient']) | list }}"
  loop_control:
    label: '{{ item.0 }} / {{ item.1 }}'
