---
- name: Converge authority
  jomrr.ca.authority:
    base_dir: '{{ ca_test_root.path }}/pki'
    ca_name: test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: root
    common_name: Test Root
    days: 3650
    key_type: P-256
    key_passphrase: test-root-passphrase
  register: ca_result
- name: Verify change prediction for authority
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Converge authority
  jomrr.ca.authority:
    base_dir: '{{ ca_test_root.path }}/pki'
    ca_name: test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: issuer
    parent: root
    common_name: Test Issuer
    email: pki@example.test
    days: 365
    key_type: P-256
    key_passphrase: test-issuer-passphrase
    parent_key_passphrase: test-root-passphrase
  register: ca_result
- name: Verify change prediction for authority
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Converge chain
  jomrr.ca.chain:
    base_dir: '{{ ca_test_root.path }}/pki'
    name: issuer
  register: ca_result
- name: Verify change prediction for chain
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Converge certificate
  jomrr.ca.certificate:
    base_dir: '{{ ca_test_root.path }}/pki'
    ca_name: test
    base_url: http://pki.example.test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: &id001
      - name: root
        parent: root
        key_passphrase: test-root-passphrase
        default_days: 365
      - name: issuer
        parent: root
        key_passphrase: test-issuer-passphrase
        default_days: 90
    certificate_types: &id002
      tls_server:
        issuer: issuer
      tls_client:
        issuer: issuer
      eap_tls_client:
        issuer: issuer
      identity:
        issuer: issuer
      identity_full:
        issuer: issuer
      mskdc:
        issuer: issuer
      fritzbox:
        issuer: issuer
    certificate:
      name: web
      type: tls_server
      common_name: web.example.test
      key_type: P-256
      formats:
        - pem
        - der
        - txt
        - fullchain
  register: ca_result
- name: Verify change prediction for certificate
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Verify readable single certificate metadata
  ansible.builtin.assert:
    that:
      - ca_result.name == 'web'
      - ca_result.profile == 'tls_server'
      - ca_result.formats == ['pem', 'der', 'txt', 'fullchain']
      - ca_result.cert_path == ca_test_root.path ~ '/pki/certs/web/web.pem'
      - "'test-root-passphrase' not in (ca_result | to_json)"
      - "'test-issuer-passphrase' not in (ca_result | to_json)"

- name: Consume the registered certificate path in a follow-up task
  ansible.builtin.stat:
    path: '{{ ca_result.cert_path }}'
  register: ca_registered_certificate

- name: Verify the registered certificate path identifies the created file
  ansible.builtin.assert:
    that:
      - ca_registered_certificate.stat.isreg

- name: Converge certificate_batch
  jomrr.ca.certificate_batch:
    base_dir: '{{ ca_test_root.path }}/pki'
    ca_name: test
    base_url: ''
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    authorities: *id001
    certificate_types: *id002
    certificates:
      - name: tls_server
        type: tls_server
        common_name: tls_server.example.test
        key_type: P-256
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
      - name: tls_client
        type: tls_client
        common_name: tls_client.example.test
        key_type: P-256
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
      - name: eap_tls_client
        type: eap_tls_client
        common_name: eap_tls_client.example.test
        key_type: P-256
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
      - name: identity
        type: identity
        common_name: identity.example.test
        key_type: P-256
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
      - name: identity_full
        type: identity_full
        common_name: identity_full.example.test
        key_type: P-256
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
      - name: mskdc
        type: mskdc
        common_name: mskdc.example.test
        key_type: P-256
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
      - name: fritzbox
        type: fritzbox
        common_name: fritzbox.example.test
        key_type: RSA
        key_size: 2048
        pfx_passphrase: test-export-passphrase
        krb5_realm: EXAMPLE.TEST
        ad_object_guid: 8f2a02d1-862a-47cf-9a9b-6bda9c3bd2c5
  register: ca_result
- name: Verify change prediction for certificate_batch
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Verify readable batch certificate metadata
  ansible.builtin.assert:
    that:
      - "ca_result.issuer_groups == {'issuer': 7}"
      - "'********' not in (ca_result.results | to_json)"
      - "'test-export-passphrase' not in (ca_result | to_json)"
      - "'test-issuer-passphrase' not in (ca_result | to_json)"

- name: Consume each registered batch certificate path in a follow-up task
  ansible.builtin.stat:
    path: '{{ item.cert_path }}'
  loop: '{{ ca_result.results }}'
  loop_control:
    label: '{{ item.name }}'
  register: ca_registered_batch

- name: Verify the registered batch paths identify the created files
  ansible.builtin.assert:
    that:
      - item.stat.isreg
  loop: '{{ ca_registered_batch.results }}'
  loop_control:
    label: '{{ item.item.name }}'

- name: Converge crl
  jomrr.ca.crl:
    base_dir: '{{ ca_test_root.path }}/pki'
    ca_name: test
    owner: '{{ ca_test_uid.stdout }}'
    group: '{{ ca_test_gid.stdout }}'
    name: issuer
    key_passphrase: test-issuer-passphrase
    next_update_days: 30
  register: ca_result
- name: Verify change prediction for crl
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Converge publish_archive
  jomrr.ca.publish_archive:
    base_dir: '{{ ca_test_root.path }}/pki'
    dest: '{{ ca_test_root.path }}/public.tar'
    artifacts:
      - src: '{{ ca_test_root.path }}/pki/ca/issuer-ca.der'
        area: aia
        file: issuer.der
      - src: '{{ ca_test_root.path }}/pki/crl/issuer-ca.crl'
        area: cdp
        file: issuer.crl
  register: ca_result
- name: Verify change prediction for publish_archive
  ansible.builtin.assert:
    that:
      - ca_result.changed == ca_expect_changed
- name: Omit redundant root chain
  jomrr.ca.chain:
    base_dir: '{{ ca_test_root.path }}/pki'
    name: root
  register: ca_result
- name: Verify root chain state
  ansible.builtin.assert:
    that:
      - ca_result.state == 'absent'
      - ca_result is not changed
