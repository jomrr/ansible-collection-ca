---
name: Collection tests
"on":
  workflow_call:
permissions:
  contents: read
jobs:
  hooks:
    name: Collection and embedded role hooks
    runs-on: ubuntu-latest
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ansible_collections/jomrr/ca
    steps:
      - name: Check out the collection
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          path: ansible_collections/jomrr/ca
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.group || matrix.scenario || 'default' }}
          cache-dependency-glob: ansible_collections/jomrr/ca/pyproject.toml
      - name: Install tools from pyproject.toml
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --group dev --group ansible-stable-2-20 --group docs --refresh-package ansible-core
      - name: Add collection tools to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: |
          ansible-galaxy collection install -r tests/integration/requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"
          ansible-galaxy role install -r tests/integration/requirements.yml
      - name: Verify recorded submodules
        run: git submodule status --recursive | awk '/^[-+U]/ { print; bad = 1 } END { exit bad }'
      - name: Run collection hooks
        run: pre-commit run --all-files
  sanity:
    name: Sanity (Ansible ${{ matrix.ansible }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: "stable-2.20"
            python: "3.12"
            group: "ansible-stable-2-20"
            experimental: false
          - ansible: "stable-2.21"
            python: "3.12"
            group: "ansible-stable-2-21"
            experimental: false
          - ansible: "devel"
            python: "3.13"
            group: "ansible-devel"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ansible_collections/jomrr/ca
    steps:
      - name: Check out the collection
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          path: ansible_collections/jomrr/ca
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.group || matrix.scenario || 'default' }}
          cache-dependency-glob: ansible_collections/jomrr/ca/pyproject.toml
      - name: Install tools from pyproject.toml
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python --group ${{ matrix.group }} --refresh-package ansible-core
      - name: Add collection tools to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run sanity
        run: ansible-test sanity --docker --python ${{ matrix.python }} -v
  units:
    name: Units (Ansible ${{ matrix.ansible }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: "stable-2.20"
            python: "3.12"
            group: "ansible-stable-2-20"
            experimental: false
          - ansible: "stable-2.21"
            python: "3.12"
            group: "ansible-stable-2-21"
            experimental: false
          - ansible: "devel"
            python: "3.13"
            group: "ansible-devel"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ansible_collections/jomrr/ca
    steps:
      - name: Check out the collection
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          path: ansible_collections/jomrr/ca
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.group || matrix.scenario || 'default' }}
          cache-dependency-glob: ansible_collections/jomrr/ca/pyproject.toml
      - name: Install tools from pyproject.toml
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python --group ${{ matrix.group }} --refresh-package ansible-core
      - name: Add collection tools to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Report missing unit suite
        if: hashFiles('ansible_collections/jomrr/ca/tests/unit/**') == ''
        run: echo 'SKIPPED units - no tests/unit suite'
      - name: Run units
        if: hashFiles('ansible_collections/jomrr/ca/tests/unit/**') != ''
        run: ansible-test units --docker --python ${{ matrix.python }} -v
