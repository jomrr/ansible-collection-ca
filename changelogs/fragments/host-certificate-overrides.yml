---
minor_changes:
  - host_certificates - select the FQDN host variable with fqdn_var (default fqdn) instead
    of the fallback domain; domain may be omitted when all selected hosts supply that variable.
  - host_certificates - select per-host certificate overrides with overrides_var (default
    ca_certificate), append and deduplicate SANs,
    and sort by the resulting unique certificate names without modifying input data.
