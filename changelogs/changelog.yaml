---
ancestor: null
releases:
  1.0.0:
    changes:
      minor_changes:
        - Initial extraction of the CA role modules and authority map filter with
          collection-qualified imports.
    fragments:
      - initial.yml
    release_date: '2026-09-21'
  1.0.1:
    changes:
      bugfixes:
        - Embed module and filter documentation in Python files to prevent duplicate
          Galaxy entries.
        - Exclude documentation source and build directories from the Galaxy package.
        - Share module documentation through Python fragments and run Pylint serially
          so local and CI duplicate checks use the same files.
    fragments:
      - galaxy-documentation.yml
    release_date: '2026-09-21'
  1.1.0:
    changes:
      breaking_changes:
        - External CSR tasks must define common_name or subject_ordered and explicitly
          supply approved SANs. Omitted or empty SANs no longer import identities
          from the CSR; normal profile defaults apply.
      bugfixes:
        - authority - retain issuer generations and pin legacy AIA/CDP URLs across
          CA rekey.
        - authority, certificate, certificate_batch - reject issuance that exceeds
          path length limits anywhere in the managed CA chain before writing certificate
          material.
        - certificate and certificate_batch - mask nested secrets without redacting
          public certificate names, formats, issuer groups or returned paths.
        - certificate and certificate_batch - preserve nested secret masking in invocation
          logs and complete results with newer Ansible versions.
        - certificate and certificate_batch - protect nested passphrases during Ansible
          argument validation, check-mode skips and invocation logging.
        - certificate, certificate_batch - permit a root to sign explicitly requested
          external CA certificates when the issuer chain permits the additional CA
          level.
        - crl - recover generations from existing CA archives and retire old CRLs
          at issued certificate or CA expiry.
        - crl - reject ambiguous names shared by a leaf and CA under the same issuer
          instead of selecting one silently.
        - crl - resolve managed CA certificates by name and fingerprint in their parent's
          CRL, including historical CA certificates by fingerprint.
        - crl - reuse one authority-history snapshot and legacy URL resolution per
          run, including migration; derive publication paths and select signing keys
          without rereading CA certificates.
        - crl - sign CRLs with each active generation key and preserve monotonic CRL
          numbers across rollover.
        - crl - use the CA certificate subject for CRL issuance and comparison, preserving
          email addresses and ordered subject attributes; replace existing CRLs with
          mismatched issuers.
        - publish_archive - include retained issuer certificates and their matching
          active or final CRLs.
        - publish_archive - reuse the loaded authority history and resolved legacy
          URL owner for every published generation.
      minor_changes:
        - Certificate inventory records include a SHA-256 public key fingerprint to
          retain compromised-key identity across generations; older records use current
          or archived certificates.
        - Consolidate internal artifact paths, inventory certificate lookup, Key Usage
          mapping, file mode parsing and format validation while preserving module
          interfaces and output formats.
        - certificate and certificate_batch - add the issuing_ca profile for signing
          external issuing CA CSRs with a managed root, with CA constraints, signing
          key usages and fullchain export defaults.
        - crl - expose generation lifetimes and accept archived_key_passphrases for
          keys with different passphrases.
        - crl - support legacy_generation selection and report migration_conflicts
          when earlier rollovers reused issuer URLs.
      security_fixes:
        - certificate and certificate_batch - stop inheriting external CSR subject
          attributes and SANs; use task-approved identities and profile defaults after
          verifying the CSR signature.
        - certificate, certificate_batch and authority - reject reuse of locally known
          keys revoked for key_compromise or ca_compromise, including renewal and
          external CSRs. Replacement requires a new key; certificate names and serial
          numbers do not bypass the check.
    fragments:
      - ansible-redaction-compatibility.yml
      - authority-revocation-selectors.yml
      - ca-key-rollover.yml
      - certificate-secret-redaction.yml
      - compromised-key-reuse.yml
      - crl-issuer.yml
      - csr-identities.yml
      - generation-state.yml
      - issuer-path-length.yml
      - issuing-ca-profile.yml
      - shared-artifact-helpers.yml
    release_date: '2026-10-03'
  1.1.1:
    changes:
      bugfixes:
        - Preserve the last non-empty base_url in composed inventory when modules
          omit the parameter or pass an empty string, avoiding changed results when
          alternating authority, certificate, certificate_batch and crl tasks.
        - certificate and certificate_batch - avoid automatic leaf Extended Key Usage
          and common-name DNS SAN defaults when issuing certificates with CA:TRUE,
          including external CA CSRs signed with tls_server or tls_client profiles.
        - certificate and certificate_batch - honor explicitly empty extended_key_usage
          and san lists, allowing certificates without EKU or automatic DNS SAN while
          preserving omitted leaf profile defaults and required mskdc PKINIT SANs.
        - crl - stop requiring the ignored common_name parameter. The CRL issuer comes
          entirely from the CA certificate. Both common_name and subject remain accepted
          as optional, ignored compatibility parameters; omit them in new tasks.
    fragments:
      - ca-profile-extensions.yml
      - crl-optional-subject.yml
      - inventory-base-url.yml
    release_date: '2026-10-03'
  1.1.2:
    changes:
      bugfixes:
        - certificate and certificate_batch - make ad_object_guid optional for the
          mskdc profile. Omitted or empty values skip the NTDS objectGUID extension;
          non-empty invalid GUIDs still fail validation.
    fragments:
      - mskdc-optional-guid.yml
    release_date: '2026-10-05'
  1.2.0:
    modules:
      - description: Manage authorities and chains in one parent\-first batch
        name: authority_batch
        namespace: ''
      - description: Manage authority CRLs in one batch
        name: crl_batch
        namespace: ''
      - description: Publish public AIA/CDP files directly on the CA host
        name: publish
        namespace: ''
    release_date: '2026-11-10'
  1.2.1:
    changes:
      minor_changes:
        - Cache public bindings for managed private files and skip RSA validation
          only for unchanged collection-generated keys inside the CA directory.
        - Defer certificate and CRL private-key loading until signing, and share authority
          signer material across siblings.
        - publish now supports check mode and manages webroot, aia and crl directories
          with the new directory_mode option.
    fragments:
      - lazy-keys-publish.yml
    release_date: '2026-11-10'
  1.2.2:
    changes:
      breaking_changes:
        - Stored inventory JSON no longer contains status or renewal_status. Consumers
          must derive time-dependent values when reading; compose_inventory retains
          the enriched read view.
      bugfixes:
        - Persist only stable inventory metadata, avoiding daily changed results in
          normal and check-mode runs. Validity and renewal status are computed in
          read views.
        - Skip repeated RSA validation for matching receipts from either generation
          or prior full validation, including existing CA keys.
    fragments:
      - stable-inventory.yml
    release_date: '2026-11-10'
  1.3.0:
    changes:
      bugfixes:
        - authority_batch - do not predict descendant chain changes for root renewal
          alone when the intermediate certificates remain unchanged.
        - certificate, certificate_batch - exclude self-signed roots from chain copies,
          fullchain, PKCS#12 and FritzBox bundles, including when reading legacy chain
          sources. Direct root issuers produce empty issuer chains.
        - chain, authority_batch - exclude self-signed roots from PEM, DER and text
          chain exports while retaining intermediate order and self-issued rollover
          certificates.
      minor_changes:
        - artifacts - add a controller filter listing configured public authority
          and certificate files using the shared output layout.
        - authority, authority_batch, certificate, certificate_batch - add the optional
          cer export format for DER-encoded certificates with a Windows-style .cer
          extension, including result paths, inventory, archival and batch check mode.
        - certificate and certificate_batch - accept publish_private (default false)
          to include local keys and requested private exports in artifact manifests.
        - certificate, certificate_batch - add PEM bundle exports with selectable
          PKCS#8 or traditional RSA/EC private key encoding, retaining key encryption
          and excluding the root CA.
        - certificate, certificate_batch - add pfx_encryption (best or compatibility2022),
          optional pfx_iterations and pfx_friendly_name (with friendly_name retained
          as an alias).
        - certificate, certificate_batch - compare decoded PKCS#12 content, friendly
          names and encryption settings for idempotent exports; pfx/p12 now require
          asn1crypto on the managed host.
        - certificate, certificate_batch - share the PEM bundle writer with FRITZ!Box
          exports while preserving their existing filename, order and key bytes.
        - host_certificates - add a controller filter that creates sorted TLS server
          certificate definitions from inventory hosts, with DNS/IP SANs and configurable
          key type and formats.
    fragments:
      - artifacts.yml
      - bundle-export.yml
      - cer-export.yml
      - host-certificates.yml
      - pkcs12-encryption.yml
      - root-free-chains.yml
    plugins:
      filter:
        - description: List configured public and opted\-in private certificate files
          name: artifacts
          namespace: null
        - description: Build TLS server certificate definitions from inventory hosts
          name: host_certificates
          namespace: null
    release_date: '2026-11-17'
  1.3.1:
    changes:
      bugfixes:
        - bundle - retain encrypted key bytes when repairing the order to preserve
          idempotence. Traditional bundles and the fritzbox export retain their existing
          order and key encoding.
        - bundle - with bundle_key_format=pkcs8, place the private key immediately
          after the leaf certificate, before issuer intermediates; repair existing
          bundles without reissuing certificates.
    fragments:
      - bundle-key-order.yml
    release_date: '2026-11-23'
  1.4.0:
    changes:
      minor_changes:
        - host_certificates - select per-host certificate overrides with overrides_var
          (default ca_certificate), append and deduplicate SANs, and sort by the resulting
          unique certificate names without modifying input data.
        - host_certificates - select the FQDN host variable with fqdn_var (default
          fqdn) instead of the fallback domain; domain may be omitted when all selected
          hosts supply that variable.
    fragments:
      - host-certificate-overrides.yml
    release_date: '2026-11-25'
